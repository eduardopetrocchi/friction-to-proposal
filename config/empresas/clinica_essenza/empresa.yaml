briefings:
  base: "Semana típica de operação: agenda com ocupação regular, contatos de novos pacientes chegando pelo WhatsApp e pelo Instagram, calendário editorial em andamento com revisão de conformidade e rotina normal de confirmações e retornos."
  por_cenario:
    pico_demanda: "Semana de forte procura: aumento de contatos e pedidos de agendamento, agenda quase lotada, fila de respostas no WhatsApp e pressão para manter a qualidade do atendimento e o tom da marca."
    fechamento_mes: "Semana de fechamento mensal: consolidar receita por procedimento, ocupação da agenda e faltas, preparar o relatório de indicadores e organizar os retornos e confirmações do mês seguinte."
    lancamento_campanha: "Semana de divulgação de um novo protocolo ou tecnologia: produzir conteúdo educativo para Instagram e site em curto prazo, com revisão de conformidade ética, e preparar o atendimento para o aumento de dúvidas."

