briefings:
  base: "Semana típica de operação: calendário de conteúdo regular nas redes, landing page ativa recebendo tráfego moderado, fluxo normal de pedidos e estoque estável, com atendimento de dúvidas sobre ingredientes e uso dos produtos."
  por_cenario:
    pico_demanda: "Semana de forte demanda: aumento súbito de pedidos e de dúvidas no SAC, risco de ruptura em produtos mais vendidos e necessidade de manter o conteúdo e a comunicação com o cliente em dia."
    fechamento_mes: "Semana de fechamento mensal: consolidar vendas, estoque e desempenho das campanhas do mês, preparar o relatório de indicadores e planejar a pauta e as compras do mês seguinte."
    lancamento_campanha: "Semana de lançamento de um novo produto: produzir landing page, copy, peças visuais e pauta de conteúdo em curto prazo, alinhar a mensagem ao posicionamento botânico e preparar o atendimento e o estoque para o lançamento."

