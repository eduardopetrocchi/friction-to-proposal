id: aurora_skin
company_name: Aurora Skin
nome_completo: "Aurora Skin — marca-conceito de skincare botânico"
segmento: "Skincare botânico e cosmecêutica; marca de cuidados com a pele"
modelo: B2C
porte: "Marca-conceito de pequeno porte (inferido)"
publico_alvo: "Consumidores interessados em skincare botânico, clean beauty, ciência aplicada aos cuidados com a pele, proteção da barreira cutânea e autocuidado consciente."

marca:
  voz_tom: "Acolhedor, sensorial, elegante e claro; combina natureza, ciência, transparência e autocuidado consciente, sem exageros."
  pilares_conteudo:
    - "Ciência botânica e bioativos"
    - "Barreira cutânea, microbioma e saúde da pele"
    - "Autocuidado consciente e rituais simples"
    - "Educação sobre ingredientes e formulações"
    - "Apresentação sensorial de produtos e experiências"
  palavras_evitar:
    - "promessas milagrosas"
    - "resultados garantidos"
    - "linguagem alarmista"
    - "alegações de eficácia sem comprovação"
    - "estética agressiva ou sensacionalista"
  idioma: "Português (Brasil)"

restricoes:
  regulatorias:
    - "Cosméticos não tratam doenças: não atribuir propriedades terapêuticas ou medicamentosas aos produtos."
    - "Alegações de eficácia só com comprovação e em linguagem moderada, respeitando as normas da ANVISA e as boas práticas de publicidade do CONAR."
    - "Tratar dados de clientes conforme a LGPD, usando apenas dados fictícios."
  conteudo:
    - "Manter o tom acolhedor, sensorial e elegante, sem apelo alarmista ou estética agressiva."
    - "Ao citar ingredientes e bioativos, explicar a função de forma clara e sem exagero."
    - "Evitar comparações depreciativas com outras marcas ou com a aparência do consumidor."
  projeto:
    - "Executar todo o trabalho de forma manual, com ferramentas básicas (documentos, planilhas e anotações internas)."
    - "Não sugerir automação, agentes de IA ou serviços de terceiros como solução; apenas descrever o problema encontrado."
    - "Não mencionar a IdeiaFlui nem seus serviços."
    - "Usar somente os dados fictícios fornecidos; sinalizar a falta de informação em vez de inventá-la."
    - "Registrar, para cada etapa, o tempo manual estimado (simulado), a frequência e o risco de erro."
    - "Classificar cada gargalo em categorias operacionais (conteúdo, presença web, conversão, imagem ou dados e processos)."

setores:
  - agente: agente_marketing_aurora
    area: "Marketing e conteúdo (posicionamento, pauta e calendário de conteúdo)"
  - agente: agente_ecommerce_aurora
    area: "E-commerce e conversão (landing page, ofertas e pós-venda)"
  - agente: agente_produto_aurora
    area: "Produto e bioativos (revisão técnica e segurança cosmética)"
  - agente: gerente_geral_aurora # consolidador: produz o relatório gerencial
    area: "Gerência geral e operações da marca"

