briefings:
  base: "Semana típica de operação: volume regular de NF-e de entrada e saída a capturar e conciliar, carteira de clientes estável, contas a receber com poucos atrasos e demanda comercial regular, com leads chegando pelo conteúdo e por indicação."
  por_cenario:
    pico_demanda: "Semana de forte demanda: entrada de novos clientes acima da capacidade usual, aumento de notas a processar e vários pedidos de diagnóstico ao mesmo tempo, pressionando prazos de todos os setores."
    fechamento_mes: "Semana de fechamento mensal: pico de NF-e a conciliar, prazo apertado para DRE gerencial e fluxo de caixa, cobranças pendentes e relatórios a entregar aos clientes."
    lancamento_campanha: "Semana de lançamento de campanha comercial: necessidade de produzir conteúdo extra sobre KPIs e DRE, qualificar um volume maior de leads e conduzir mais diagnósticos gratuitos."

