pacotes:
  - id: pacote_presenca_digital
    nome: "Página de Vendas em 10 Dias (Presença Digital & Conversão)"
    areas: [vendas]
    resumo: "Página profissional focada em transformar visitantes em contatos qualificados no WhatsApp."
    prazo: "10 dias úteis"
    investimento: "R$ 1.990"
    entregas:
      [
        "Diagnóstico de 30 min e briefing de conversão",
        "Mini brandbook de 1 página",
        "1 página responsiva com até 8 seções",
        "Copywriting completo",
        "4 imagens geradas com IA",
        "Botões de WhatsApp com mensagem pré-preenchida",
        "Formulário que encaminha o lead por e-mail",
        "SEO técnico básico",
      ]
    fora_do_escopo:
      [
        "Site com várias páginas, loja virtual ou checkout",
        "Blog e SEO avançado contínuo",
        "Gestão de tráfego pago",
      ]
  - id: pacote_lote_editorial
    nome: "Lote Editorial de 30 Dias (Marketing & Conteúdo Estratégico)"
    areas: [marketing]
    resumo: "Presença constante e estratégica no Instagram sem montar equipe interna."
    prazo: "10 dias úteis"
    investimento: "R$ 1.490"
    entregas:
      [
        "Guia de voz e tom sob medida",
        "Calendário de 30 dias com 12 publicações em 4 pilares",
        "12 peças prontas (4 carrosséis, 2 roteiros de reels, 2 sequências de stories, 4 posts estáticos)",
        "Criativo visual com IA, legendas e hashtags",
        "Playbook de prompts e skills",
      ]
    fora_do_escopo:
      [
        "Publicação e agendamento manual",
        "Gestão de comunidade e SAC",
        "Tráfego pago",
        "Gravação ou edição de vídeo",
        "Parecer técnico-jurídico formal (CFM, OAB)",
      ]
  - id: pacote_operacao_automatizada
    nome: "Operação Automatizada em 15 Dias (Dados, Planilhas & Automação n8n)"
    areas: [financas]
    resumo: "Para quem perde tempo com tarefas e planilhas manuais e quer acompanhar números com alertas imediatos."
    prazo: "15 dias úteis, a contar do recebimento de acessos e dados"
    investimento: "R$ 2.990"
    entregas:
      [
        "Diagnóstico de 1 processo crítico",
        "Planilha base no Google Sheets com até 4 abas",
        "1 fluxo no n8n: entrada, validação, planilha, notificação",
        "Alertas por e-mail, Telegram ou WhatsApp",
        "Painel com até 6 KPIs",
        "Até 3 regras de alerta",
        "1 modelo de relatório mensal",
        "Documentação, export do fluxo e 1h de treinamento",
        "30 dias de suporte",
      ]
    fora_do_escopo:
      [
        "ERP legado sem API documentada",
        "Mais de 1 fluxo principal",
        "Custos de VPS e de APIs de mensageria",
      ]
    premissas:
      [
        "Dicionário de dados e KPIs aprovados previamente pela cliente (1 rodada de validação).",
        "Execução em VPS própria da cliente (ex.: cerca de R$ 30/mês) ou n8n Cloud, com esses custos pagos pela cliente.",
        "Integrações dependem de API pública documentada; ERP proprietário legado sem API fica fora do escopo.",
      ]
  - id: combo_maquina_aquisicao
    nome: "Máquina de Aquisição (Página de Vendas + Lote Editorial)"
    areas: [vendas, marketing]
    resumo: "Landing page de alta conversão e 1 mês de publicações estratégicas com a mensagem sincronizada."
    prazo: "conforme os dois pacotes"
    investimento: "R$ 2.990"
    entregas:
      [
        "Tudo da Página de Vendas em 10 Dias",
        "Tudo do Lote Editorial de 30 Dias",
        "Copy da página sincronizada com os posts",
      ]

metodologia:
  - etapa: "Diagnóstico & Entendimento"
    descricao: "Mapeamos o gargalo, os objetivos de negócio e o contexto operacional."
  - etapa: "Estratégia & Arquitetura"
    descricao: "Desenhamos a esteira da solução, escolhendo as ferramentas mais adequadas."
  - etapa: "Desenvolvimento & Testes"
    descricao: "Construímos, iteramos e validamos fluxos e interfaces sob critérios de qualidade."
  - etapa: "Entrega & Operação"
    descricao: "Entregamos a solução validada, documentada e pronta para uso na rotina."

condicoes_comerciais:
  pagamento: "PIX 50/50 (50% de entrada e 50% na aprovação da entrega) ou até 3x sem juros no cartão de crédito."
