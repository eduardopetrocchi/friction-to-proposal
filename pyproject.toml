[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ideiaflui"
version = "0.1.0"
description = "Sistema multiagente com LangGraph e CrewAI para simulação operacional e geração de propostas comerciais automatizadas."
authors = [
    { name = "Eduardo" }
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai>=1.14.0",
    "crewai-tools>=1.14.0",
    "langgraph>=1.1.0",
    "langchain>=1.2.0",
    "langchain-core>=1.5.0",
    "langchain-google-genai>=4.2.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
